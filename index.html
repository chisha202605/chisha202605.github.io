<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>家庭共享菜谱</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .ingredient-row { display: flex; gap: 10px; margin-bottom: 8px; }
    .ingredient-row input { flex: 1; }
    .video-row { display: flex; gap: 10px; margin-bottom: 8px; }
    .btn-danger { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .btn-small { padding: 4px 8px; font-size: 12px; }
    .filter-section { margin: 10px 0; display: flex; gap: 10px; align-items: center; }
    .filter-section input { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>家庭共享菜谱</h1>
      <div class="nav">
        <button onclick="showPage('home')">首页</button>
        <button onclick="showPage('addDish')">新增菜品</button>
        <button onclick="showPage('meal')">配餐</button>
        <button onclick="showPage('mine')">我的</button>
      </div>
    </header>

    <!-- 首页 -->
    <div id="page-home" class="page">
      <div class="filter-section">
        <input id="searchKeyword" placeholder="搜索菜名/食材" oninput="renderDish()"/>
        <button onclick="showPage('categoryManage')">分类管理</button>
      </div>
      <div class="category-nav" id="categoryNav"></div>
      <div class="dish-list" id="dishList"></div>
    </div>

    <!-- 分类管理页面 -->
    <div id="page-categoryManage" class="page hidden">
      <button onclick="showPage('home')">← 返回首页</button>
      <h2>分类管理</h2>
      <div style="margin:15px 0;">
        <input id="newCateName" placeholder="输入新分类名称" style="width:200px;">
        <button onclick="addCategory()">新增分类</button>
      </div>
      <div id="cateManageList"></div>
    </div>

    <!-- 菜品详情页 -->
    <div id="page-detail" class="page hidden">
      <button onclick="showPage('home')">← 返回列表</button>
      <h2 id="detailName"></h2>
      <p id="detailCategory"></p>
      <div id="detailIngredients"></div>
      <div id="detailSteps"></div>
      <div id="detailVideos"></div>
      <button onclick="editCurrentDish()">编辑菜品</button>
    </div>

    <!-- 新增/编辑菜品 -->
    <div id="page-addDish" class="page hidden">
      <h2 id="addEditTitle">新增菜品</h2>
      <div class="form">
        <input id="dishName" placeholder="菜名"/>
        <select id="dishCategory"></select>

        <h4>食材</h4>
        <div id="ingredientList">
          <div class="ingredient-row">
            <input type="text" placeholder="食材名称" class="ing-name">
            <input type="text" placeholder="用量" class="ing-amount">
            <button type="button" class="btn-danger btn-small" onclick="removeIngredient(this)">删除</button>
          </div>
        </div>
        <button type="button" onclick="addIngredientRow()">+ 新增食材</button>

        <h4>详细做法</h4>
        <textarea id="dishStep" placeholder="请按步骤输入做法，系统会自动生成编号列表"></textarea>

        <h4>视频链接</h4>
        <div id="videoList">
          <div class="video-row">
            <input type="text" placeholder="视频链接" class="video-url">
            <button type="button" class="btn-danger btn-small" onclick="removeVideo(this)">删除</button>
          </div>
        </div>
        <button type="button" onclick="addVideoRow()">+ 新增视频链接</button>

        <input type="hidden" id="editDishId">
        <button onclick="saveDish()">保存菜品</button>
      </div>
    </div>

    <!-- 配餐页 -->
    <div id="page-meal" class="page hidden">
      <h2>配餐中心</h2>
      <div style="margin:10px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <div>
          <label>生成数量：</label>
          <input type="number" id="mealCount" value="5" min="1" style="width:60px;">
        </div>
        <div>
          <label>荤菜最少：</label>
          <input type="number" id="minMeat" value="1" min="0" style="width:60px;">
        </div>
        <div>
          <label>汤最少：</label>
          <input type="number" id="minSoup" value="1" min="0" style="width:60px;">
        </div>
        <div>
          <label>几天内不重复：</label>
          <input type="number" id="noRepeatDays" value="3" min="1" style="width:60px;">
        </div>
        <button onclick="randomMeal()">随机配餐</button>
        <button onclick="manualMeal()">手动选菜配餐</button>
      </div>
      <div id="mealResult" class="meal-result"></div>
    </div>

    <!-- 个人中心 -->
    <div id="page-mine" class="page hidden">
      <h2>我的</h2>
      <button onclick="showRecycle()">菜品回收站</button>
      <button onclick="exportData()">导出备份</button>
      <button onclick="importData()">导入备份</button>
      <div id="recycleList"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
